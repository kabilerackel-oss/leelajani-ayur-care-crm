<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leelajani Ayur Care — Lead CRM</title>

<style>
:root{
  --teal:#173f38;
  --gold:#c9a24a;
  --bg:#f8f5ee;
  --light:#e6e2d8;
  --white:#fff;
  --text:#26322e;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* CRITICAL FIX */
.hidden{
  display:none !important;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#173f38,#274f46);
}

.loginbox{
  background:#fff;
  width:min(430px,92vw);
  padding:35px;
  border-radius:18px;
  box-shadow:0 25px 80px #0004;
}

.loginbox h1{
  color:var(--teal);
  margin-top:0;
}

.field{
  margin:12px 0;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:10px;
  border:1px solid var(--light);
  border-radius:9px;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:var(--teal);
  color:#fff;
}

.gold{
  background:var(--gold);
  color:#1d281f;
}

.light{
  background:#fff;
  color:var(--teal);
  border:1px solid var(--light);
}

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:230px;
  background:var(--teal);
  color:#fff;
  padding:20px 12px;
}

.brand{
  padding:8px 10px 25px;
}

.brand b{
  font-size:21px;
  display:block;
}

.nav button{
  display:block;
  width:100%;
  text-align:left;
  background:none;
  color:#fff;
  border:0;
  padding:12px;
  border-radius:8px;
  margin:3px 0;
}

.nav button.active,
.nav button:hover{
  background:#ffffff18;
}

.main{
  margin-left:230px;
}

.top{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--light);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 25px;
}

.content{
  padding:22px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card{
  background:#fff;
  border:1px solid var(--light);
  border-radius:12px;
  padding:17px;
}

.metric{
  font-size:28px;
  font-weight:800;
}

.muted{
  color:#68736f;
  font-size:13px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input,
.toolbar select{
  padding:10px;
  border:1px solid var(--light);
  border-radius:9px;
}

.grow{
  flex:1;
}

.tablewrap{
  overflow:auto;
  background:#fff;
  border:1px solid var(--light);
  border-radius:12px;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid var(--light);
  text-align:left;
  font-size:13px;
}

.table th{
  background:#faf8f2;
}

.badge{
  padding:4px 8px;
  border-radius:20px;
  background:#e9f2ef;
  font-size:11px;
}

/*
 IMPORTANT:
 Modal itself starts hidden.
 .hidden !important guarantees it stays hidden.
*/
.modal{
  position:fixed;
  inset:0;
  background:#0006;
  display:grid;
  place-items:center;
  padding:20px;
  z-index:9999;
}

.modal.hidden{
  display:none !important;
}

.modalbox{
  background:#fff;
  width:min(850px,96vw);
  max-height:90vh;
  overflow:auto;
  border-radius:15px;
  padding:20px;
  box-shadow:0 25px 80px #0005;
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.x{
  border:0;
  background:none;
  font-size:25px;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

@media(max-width:850px){

  .sidebar{
    width:65px;
  }

  .brand b,
  .brand small,
  .nav span{
    display:none;
  }

  .main{
    margin-left:65px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .formgrid{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){

  .cards{
    grid-template-columns:1fr;
  }

  .top{
    padding:0 12px;
  }

  .content{
    padding:12px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="login" class="login">

  <div class="loginbox">

    <h1>LEELAJANI</h1>

    <p>Ayur Care — Lead CRM</p>

    <div class="field">
      <label>Username</label>
      <input id="u" autocomplete="username">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>

    <button
      class="btn gold"
      style="width:100%"
      onclick="login()">
      Sign in
    </button>

    <div
      id="loginError"
      class="muted"
      style="margin-top:12px;color:#a33">
    </div>

  </div>

</div>


<!-- ================= APPLICATION ================= -->

<div id="app" class="app hidden">

  <aside class="sidebar">

    <div class="brand">
      <b>LEELAJANI</b>
      <small>Lead CRM</small>
    </div>

    <div class="nav">

      <button
        id="n-dashboard"
        onclick="show('dashboard')">
        ▦ <span>Dashboard</span>
      </button>

      <button
        id="n-leads"
        onclick="show('leads')">
        ◉ <span>Leads</span>
      </button>

      <button
        id="n-approvals"
        onclick="show('approvals')">
        ✓ <span>Price Approvals</span>
      </button>

      <button
        id="n-reports"
        onclick="show('reports')">
        ▥ <span>Reports</span>
      </button>

      <button
        id="n-packages"
        onclick="show('packages')">
        ◫ <span>Packages</span>
      </button>

      <button
        id="n-users"
        onclick="show('users')">
        ♙ <span>Users</span>
      </button>

      <button onclick="logout()">
        ↪ <span>Logout</span>
      </button>

    </div>

  </aside>


  <main class="main">

    <header class="top">

      <h2 id="title">Dashboard</h2>

      <div id="who"></div>

    </header>

    <div id="content" class="content"></div>

  </main>

</div>


<!-- ================= MODAL ================= -->

<div
  id="modal"
  class="modal hidden"
  onclick="if(event.target===this)closeM()">

  <div class="modalbox">

    <div class="modalhead">

      <h3 id="mt"></h3>

      <button
        class="x"
        onclick="closeM()">
        ×
      </button>

    </div>

    <div id="mb"></div>

  </div>

</div>


<script>

/* =========================================================
   APPLICATION STATE
========================================================= */

const S = {

  token:
    localStorage.getItem('crm_token') || '',

  user:
    JSON.parse(
      localStorage.getItem('crm_user') || 'null'
    ),

  leads: [],

  packages:
    JSON.parse(
      localStorage.getItem('crm_packages') || '[]'
    )

};


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g, m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m]));

}


/* =========================================================
   API
========================================================= */

async function api(url, options = {}){

  const headers = {

    'Content-Type':
      'application/json',

    ...(options.headers || {})

  };

  if(S.token){

    headers.Authorization =
      'Bearer ' + S.token;

  }

  const response =
    await fetch(url,{
      ...options,
      headers
    });

  let data = {};

  try{

    data = await response.json();

  }catch{

    data = {};

  }

  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      'Request failed'
    );

  }

  return data;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const errorBox =
    $('loginError');

  errorBox.textContent = '';

  const username =
    $('u').value.trim();

  const password =
    $('p').value;

  if(!username || !password){

    errorBox.textContent =
      'Please enter username and password.';

    return;

  }

  try{

    const data =
      await api(
        '/api/auth/login',
        {
          method:'POST',

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    S.token =
      data.token;

    S.user =
      data.user;

    localStorage.setItem(
      'crm_token',
      S.token
    );

    localStorage.setItem(
      'crm_user',
      JSON.stringify(S.user)
    );

    boot();

  }catch(error){

    errorBox.textContent =
      error.message ||
      'Login failed.';

  }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  localStorage.removeItem(
    'crm_token'
  );

  localStorage.removeItem(
    'crm_user'
  );

  location.reload();

}


/* =========================================================
   BOOT
========================================================= */

function boot(){

  if(!S.token){

    $('login').classList.remove('hidden');

    $('app').classList.add('hidden');

    return;

  }

  $('login').classList.add('hidden');

  $('app').classList.remove('hidden');

  $('who').textContent =
    S.user?.name ||
    S.user?.username ||
    '';

  show('dashboard');

}


/* =========================================================
   ADMIN CHECK
========================================================= */

function admin(){

  return [
    'Admin',
    'Super Admin',
    'SUPER_ADMIN',
    'Operations Head'
  ].includes(
    S.user?.role
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function show(page){

  document
    .querySelectorAll('.nav button')
    .forEach(button =>
      button.classList.remove('active')
    );

  const nav =
    $('n-' + page);

  if(nav){

    nav.classList.add('active');

  }

  $('title').textContent =
    page === 'approvals'
      ? 'Price Approvals'
      : page.charAt(0).toUpperCase()
        + page.slice(1);

  const pages = {

    dashboard,
    leads,
    approvals,
    reports,
    packages,
    users

  };

  if(pages[page]){

    pages[page]();

  }

}


/* =========================================================
   MODAL
========================================================= */

function openM(title, html){

  $('mt').textContent =
    title || '';

  $('mb').innerHTML =
    html && String(html).trim()
      ? html
      : `
        <div class="card">
          <b>Unable to load this form.</b>
          <p class="muted">
            Please close this window and try again.
          </p>
        </div>
      `;

  $('modal').classList.remove('hidden');

}


function closeM(){

  $('modal').classList.add('hidden');

  $('mt').textContent = '';

  $('mb').innerHTML = '';

}


/* =========================================================
   TABLE
========================================================= */

function tbl(rows, columns){

  if(!rows || !rows.length){

    return `
      <div class="card">
        No records found.
      </div>
    `;

  }

  return `
    <div class="tablewrap">

      <table class="table">

        <thead>
          <tr>
            ${
              columns
                .map(c =>
                  `<th>${c.l}</th>`
                )
                .join('')
            }
          </tr>
        </thead>

        <tbody>

          ${
            rows.map(row => `

              <tr>

                ${
                  columns
                    .map(c => `

                      <td>
                        ${
                          c.r
                            ? c.r(row)
                            : esc(row[c.k])
                        }
                      </td>

                    `)
                    .join('')
                }

              </tr>

            `).join('')
          }

        </tbody>

      </table>

    </div>
  `;

}


/* =========================================================
   DASHBOARD
========================================================= */

async function dashboard(){

  let data = {};

  try{

    data =
      await api(
        '/api/reports/dashboard'
      );

  }catch(error){

    console.warn(
      'Dashboard API:',
      error.message
    );

  }

  $('content').innerHTML = `

    <div class="cards">

      <div class="card">

        <div class="muted">
          Active Leads
        </div>

        <div class="metric">
          ${data.activeLeads ?? '—'}
        </div>

      </div>


      <div class="card">

        <div class="muted">
          Converted
        </div>

        <div class="metric">
          ${data.convertedLeads ?? '—'}
        </div>

      </div>


      <div class="card">

        <div class="muted">
          Closed Revenue
        </div>

        <div class="metric">
          ₹${Number(
            data.revenue || 0
          ).toLocaleString('en-IN')}
        </div>

      </div>


      <div class="card">

        <div class="muted">
          Your Role
        </div>

        <div
          class="metric"
          style="font-size:18px">

          ${esc(
            S.user?.role || ''
          )}

        </div>

      </div>

    </div>


    <div
      class="card"
      style="margin-top:15px">

      <h3>
        Leelajani Lead CRM
      </h3>

      <p class="muted">
        Track lead ownership, campaigns,
        packages, services, follow-ups,
        conversion, revenue and
        custom-price approvals.
      </p>

      <p class="muted">
        Therapist and room-management
        modules are not included.
      </p>

    </div>

  `;

}


/* =========================================================
   LEADS
========================================================= */

async function leads(){

  try{

    S.leads =
      await api('/api/leads');

  }catch(error){

    console.error(error);

    S.leads = [];

  }

  $('content').innerHTML = `

    <div class="toolbar">

      <input
        class="grow"
        id="q"
        placeholder="Search leads..."
        oninput="flt()">


      <select
        id="st"
        onchange="flt()">

        <option value="">
          All statuses
        </option>

        ${
          [
            'New',
            'Contacted',
            'Interested',
            'Follow-up Required',
            'Appointment Booked',
            'Consultation Completed',
            'Treatment Booked',
            'Converted',
            'Not Interested',
            'No Response',
            'On Hold',
            'Lost',
            'Duplicate'
          ]
          .map(status =>
            `<option>${status}</option>`
          )
          .join('')
        }

      </select>


      <button
        class="btn gold"
        onclick="newLead()">

        + Add Lead

      </button>

    </div>


    <div id="lt"></div>

  `;

  render(S.leads);

}


function flt(){

  const query =
    ($('q')?.value || '')
      .toLowerCase();

  const status =
    $('st')?.value || '';

  const filtered =
    S.leads.filter(row => {

      const matchesSearch =
        !query ||
        JSON.stringify(row)
          .toLowerCase()
          .includes(query);

      const matchesStatus =
        !status ||
        row.status === status;

      return (
        matchesSearch &&
        matchesStatus
      );

    });

  render(filtered);

}


/* =========================================================
   LEAD TABLE
========================================================= */

function render(rows){

  $('lt').innerHTML =
    tbl(
      rows,
      [

        {
          l:'Lead',
          k:'name'
        },

        {
          l:'Phone',
          k:'phone'
        },

        {
          l:'Source',
          k:'source'
        },

        {
          l:'Campaign',
          r:r =>
            esc(
              r.campaign || '—'
            )
        },

        {
          l:'Service',
          r:r =>
            esc(
              r.service ||
              r.package_name ||
              '—'
            )
        },

        {
          l:'Status',
          k:'status'
        },

        {
          l:'Owner',
          k:'owner_name'
        },

        {
          l:'Last Updated',
          r:r =>
            esc(
              r.updated_at ||
              r.last_updated ||
              '—'
            )
        },

        {
          l:'Updated By',
          r:r =>
            esc(
              r.updated_by_name ||
              '—'
            )
        },

        {
          l:'Action',
          r:r => `

            <button
              class="btn light"
              onclick="editLead(${r.id})">

              Edit

            </button>

            ${
              admin()
                ? `
                  <button
                    class="btn light"
                    onclick="transfer(${r.id})">

                    Transfer

                  </button>
                `
                : ''
            }

          `
        }

      ]
    );

}


/* =========================================================
   NEW / EDIT LEAD
========================================================= */

function newLead(){

  editLead(null);

}


function editLead(id){

  const row =
    S.leads.find(
      x => x.id == id
    ) || {};

  const statuses = [

    'New',
    'Contacted',
    'Interested',
    'Follow-up Required',
    'Appointment Booked',
    'Consultation Completed',
    'Treatment Booked',
    'Converted',
    'Not Interested',
    'No Response',
    'On Hold',
    'Lost',
    'Duplicate'

  ];

  openM(
    id
      ? 'Edit Lead'
      : 'Add Lead',

    `

    <div class="formgrid">


      <div class="field">

        <label>
          Name *
        </label>

        <input
          id="ln"
          value="${esc(row.name)}">

      </div>


      <div class="field">

        <label>
          Mobile *
        </label>

        <input
          id="lp"
          value="${esc(row.phone)}">

      </div>


      <div class="field">

        <label>
          Source
        </label>

        <input
          id="ls"
          value="${esc(
            row.source || ''
          )}">

      </div>


      <div class="field">

        <label>
          Campaign / Tag
        </label>

        <input
          id="lc"
          placeholder="Ojaswini Campaign / Karkidakam / Postnatal..."
          value="${esc(
            row.campaign || ''
          )}">

      </div>


      <div class="field">

        <label>
          Service / Package
        </label>

        <input
          id="lv"
          value="${esc(
            row.service ||
            row.package_name ||
            ''
          )}">

      </div>


      <div class="field">

        <label>
          Status
        </label>

        <select id="lx">

          ${
            statuses
              .map(
                status => `

                  <option
                    ${
                      row.status === status
                        ? 'selected'
                        : ''
                    }>

                    ${status}

                  </option>

                `
              )
              .join('')
          }

        </select>

      </div>


      <div class="field">

        <label>
          Follow-up Date
        </label>

        <input
          id="ld"
          type="date"
          value="${esc(
            String(
              row.follow_up_date || ''
            ).slice(0,10)
          )}">

      </div>


      <div class="field">

        <label>
          Follow-up Time
        </label>

        <input
          id="ltm"
          type="time"
          value="${esc(
            row.follow_up_time || ''
          )}">

      </div>


      <div class="field">

        <label>
          Custom / Proposed Price
        </label>

        <input
          id="lpr"
          type="number"
          min="0"
          value="${esc(
            row.custom_price ||
            row.closed_amount ||
            ''
          )}">

      </div>


      <div class="field">

        <label>
          Payment Mode
        </label>

        <select id="lpm">

          <option>Pending</option>
          <option>UPI / GPay</option>
          <option>Bank Transfer</option>
          <option>Cash</option>
          <option>Card</option>

        </select>

      </div>


      <div class="field full">

        <label>
          Payment Proof
        </label>

        <input
          id="paymentProof"
          type="file"
          accept="image/*,.pdf">

        <p class="muted">
          GPay screenshot, bank screenshot
          or receipt can be attached.
        </p>

      </div>


      <div class="field full">

        <label>
          Notes
        </label>

        <textarea
          id="lnote">${esc(
            row.notes ||
            row.follow_up_note ||
            ''
          )}</textarea>

      </div>

    </div>


    <div class="card">

      <b>
        Custom Price Approval
      </b>

      <p class="muted">
        If a sales executive enters a
        custom price, it must be approved
        by a Super Admin before the lead
        can be treated as an approved
        conversion.
      </p>

    </div>


    <br>


    <button
      class="btn gold"
      onclick="saveLead(${id || 'null'})">

      Save Lead

    </button>

    `
  );

}


/* =========================================================
   SAVE LEAD
========================================================= */

async function saveLead(id){

  const price =
    $('lpr').value
      ? Number($('lpr').value)
      : null;

  const body = {

    name:
      $('ln').value.trim(),

    phone:
      $('lp').value.trim(),

    source:
      $('ls').value.trim(),

    campaign:
      $('lc').value.trim(),

    service:
      $('lv').value.trim(),

    status:
      $('lx').value,

    follow_up_date:
      $('ld').value || null,

    follow_up_time:
      $('ltm').value || null,

    custom_price:
      price,

    payment_method:
      $('lpm').value,

    notes:
      $('lnote').value.trim()

  };

  if(!body.name){

    alert(
      'Lead name is required.'
    );

    return;

  }

  try{

    await api(
      id
        ? '/api/leads/' + id
        : '/api/leads',
      {
        method:
          id
            ? 'PUT'
            : 'POST',

        body:
          JSON.stringify(body)
      }
    );

    closeM();

    await leads();

  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================================
   TRANSFER LEAD
========================================================= */

function transfer(id){

  if(!admin()){

    alert(
      'Only Super Admin can transfer leads.'
    );

    return;

async function download(type){

  try{

    const response =
      await fetch(
        '/api/export/' +
        type,
        {
          headers:{
            Authorization:
              'Bearer ' +
              S.token
          }
        }
      );

    if(!response.ok){

      throw new Error(
        'Export failed'
      );

    }

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement('a');

    link.href = url;

    link.download =
      'leelajani-' +
      type +
      '.csv';

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
      url
    );

  }catch(error){

    alert(
      error.message
    );

  }

}
