services:
  - type: web
    name: leelajani-ayur-care
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        fromDatabase:
          name: leelajani-crm-db
          property: connectionString

databases:
  - name: leelajani-crm-db
    plan: free
    region: singapore
    databaseName: leelajani_crm
    databaseUser: leelajani
